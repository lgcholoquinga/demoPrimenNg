<div class="flex flex-col gap-1" [class.w-full]="fluid()" [class.lgc-dp--invalid]="invalid()">
  @if (label()) {
    <label [for]="inputId()" class="font-medium text-sm">
      {{ label() }}
      @if (required()) {
        <span aria-hidden="true" class="text-red-500"> *</span>
      }
    </label>
  }

  <p-datepicker
    [inputId]="inputId()"
    [ngModel]="value()"
    (ngModelChange)="onDateChange($event)"
    [placeholder]="placeholder()"
    [dateFormat]="dateFormat()"
    [showIcon]="showIcon()"
    [showClear]="showClear()"
    [disabled]="disabled()"
    [invalid]="invalid()"
    [fluid]="fluid()"
    [required]="required()"
    [attr.aria-describedby]="hint() ? hintId() : null"
    appendTo="body"
    (onBlur)="onBlur()"
  />

  <!-- @if (hint()) {
    <small [id]="hintId()" class="text-surface-500 text-xs">{{ hint() }}</small>
  } -->
</div>
