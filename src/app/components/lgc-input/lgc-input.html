<div class="flex flex-col gap-1" [class.w-full]="fluid()">
  @if (label()) {
    <label [for]="inputId()" class="font-medium text-sm">
      {{ label() }}
      @if (required()) {
        <span aria-hidden="true" class="text-red-500"> *</span>
      }
    </label>
  }

  <input
    pInputText
    [id]="inputId()"
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [invalid]="invalid()"
    [fluid]="fluid()"
    [attr.aria-required]="required() ? true : null"
    [attr.aria-invalid]="invalid() ? true : null"
    [attr.aria-describedby]="hint() ? hintId() : null"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  @if (hint()) {
    <small [id]="hintId()" class="text-surface-500 text-xs">{{ hint() }}</small>
  }
</div>
